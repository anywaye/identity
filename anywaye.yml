
name: identity

description: Authentication, sessions, MFA, accounts and tenancy, scoped API tokens, social login, and the OIDC provider.

language: go

core: ^0.2.0

# THE LICENCE, and why it is not a field here.
#
# The grant is the file at the repository root: LICENSE, a Business Source
# Licence 1.1 (OPS-D2, taken 2026-10-10) -- free to run, free to self-host, and
# never to offer identity as a competing service, becoming Apache-2.0 on
# 2030-10-10.
#
# It is NOT declared in this document, and that is a constraint rather than an
# omission. core owns the schema, ../core/schemas/anywaye.manifest.schema.json,
# which sets `additionalProperties: false` (line 7) and lists every key it
# accepts (line 9's `properties`) -- `license` is not one of them, and there is
# no `x-anywaye-` prefix escape either. Measured, not inferred: validating this
# document with a `license: BUSL-1.1` key added returns "Additional properties
# are not allowed ('license' was unexpected)". So a licence field in this file
# would be a contract violation, and a manifest that disagreed with its own
# LICENSE would be red rather than silently wrong.
#
# The declarations this repository does make are the `info.license` blocks of
# its two contracts, openapi/v1.yaml and openid/openid.yaml, which are the files
# a generated client and an integrator read first. If core adds the field, it
# belongs here and the two blocks move with it -- in the same commit, because
# two lists that have to agree are exactly how a manifest drifts.

exposes:
  api: openapi/v1.yaml

  events:
    - identity.user.created

    - identity.oidc_client.created
    - identity.oidc_client.revoked
    - identity.mfa.enabled
    - identity.mfa.disabled
    - identity.api_key.created
    - identity.api_key.revoked
    - identity.user.email_verified
    - identity.session.revoked


env:
  - name: PORT
    required: false
    default: "8080"
    secret: false
    description: "TCP bind port."
  - name: DATABASE_URL
    required: false
    secret: true
    description: "Postgres DSN; unset = no pool."
  - name: SIGNUP_SIGNING_KEY
    required: true
    secret: true
    dev_default: "auto"
    description: "HMAC key, 32 bytes."
  - name: MFA_ENCRYPTION_KEY
    required: false
    secret: true
    dev_default: "auto"
    description: "TOTP seal key."


repository:
  url: git@github.com:anywaye/identity.git
  defaultBranch: master
  visibility: private

owner:
  team: identity
  contact: identity@anywaye.com



