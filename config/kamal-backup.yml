---

app: identity

accessory: backup

databases:
  - name: primary
    adapter: postgres
    url:
      secret: DATABASE_URL
    password:
      secret: DATABASE_PASSWORD

restic:
  repository:
    secret: RESTIC_REPOSITORY
  password:
    secret: RESTIC_PASSWORD
  init_if_missing: true
  retention:
    keep_last: 7
    keep_daily: 7
    keep_weekly: 4
    keep_monthly: 6
    keep_yearly: 2
  check_after_backup: true

backup:
  schedule: 1d

