
version: "2"

linters:
  exclusions:
    rules:
      - path: ^client/generated/api\.gen\.go$
        linters:
          - dupl
          - errcheck
          - funlen
          - gocritic
          - gochecknoglobals
          - gocyclo
          - gosec
          - ineffassign
          - lll
          - maintidx
          - misspell
          - nakedret
          - prealloc
          - revive
          - staticcheck
          - unparam
          - unused

