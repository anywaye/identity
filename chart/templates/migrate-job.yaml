# Migrations: run as an Argo CD PreSync hook before the new pod deploys.
#
# This Job runs the service's migrate binary against the database named in the
# secret. If it fails, Argo aborts the sync and the old pod stays. On success,
# Argo proceeds to deploy the new pod.
#
# Manually added (not generated by caf): the generator does not yet emit this.
apiVersion: batch/v1
kind: Job
metadata:
  name: identity-migrate
  labels:
    app.kubernetes.io/name: identity
    app.kubernetes.io/instance: identity
    app.kubernetes.io/managed-by: caf
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity
        app.kubernetes.io/instance: identity
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecrets }}
      restartPolicy: Never
      containers:
        - name: migrate
          {{- if .Values.image.digest }}
          {{- if not (regexMatch `^sha256:[0-9a-f]{64}$` .Values.image.digest) }}
          {{- fail (printf "chart: image.digest is %q, not sha256:<64 hex>." .Values.image.digest) }}
          {{- end }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/bin/migrate"]
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
