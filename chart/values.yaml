# Generated by `caf gen chart` from this project's anywaye.yml.
#
# This is the chart's DEPLOYMENT-TIME half, and it is the one file in the
# chart meant to be edited: the values commit is the write path of the
# pull-based loop (DEPLOYMENT.md — "a values commit, then wait for
# sync"), and this is the file that commit edits. The templates are the
# contract and are not. Re-running `caf gen chart` refuses to overwrite
# this file without -force, so an edit is never lost to an accident.
#
# The defaults below are derived from the manifest where the manifest
# carries the fact, and stated here where it does not.

# The image the service runs.
#
# The repository is the fleet's private OCI registry (GHCR), because the
# substrate is closed source and a pull-based system needs somewhere to
# pull from. The tag is a VALUE and is never `latest`: a floating tag
# is a deploy that changes when somebody else pushes, and the loop
# exists so that what runs is exactly what the values commit said.
# Set it at release time; the default is the chart's own version.
# The digest below is the other half of the name, and it is the half the
# Deployment renders when it is present — a digest cannot move, a tag can.
image:
  repository: ghcr.io/anywaye/identity
  tag: "0.1.0"
  # THE DIGEST — THE ONE PART OF THE NAME THAT CANNOT MOVE, AND THE HALF THE
  # POD ACTUALLY PULLS. Written by kit's publish workflow on every
  # `push: true` run: `chart.reusable.yml`'s `pin the image by digest` step
  # takes the digest from the image job's build output and rewrites this
  # line BEFORE `helm package`. It is the only value in this file a
  # workflow edits, and the reason is one measurement: the tag is
  # overwritten on every master push, so a chart pinned by TAG rendered a
  # textually IDENTICAL Deployment after every build — Argo's diff
  # reported `Synced`, rolled nothing, and `imagePullPolicy: IfNotPresent`
  # re-served the node's stale copy on every restart. MEASURED (kit's
  # roll-c5-image-digest, on gateway): the registry held `sha256:c264…37165`
  # while the node ran `sha256:8e60…e79b`, six hours after the fix was
  # published, and a refresh reported `Synced` with no diff. A digest
  # cannot move, so a new build is a textual diff Argo rolls — and the
  # chart VERSION does not, which is what lets the substrate Application
  # keep one targetRevision.
  #
  # WHAT THE COMMITTED VALUE IS: this repository's CURRENT published image,
  # read off the registry, so a fresh clone renders the pin. It is
  # REPLACED by the publish workflow on every push — the committed value
  # pins the last published image, and a publish that left it in place
  # would push a chart naming the previous build.
  #
  # EMPTY IS THE SUPPORTED ABSENCE: with no digest the Deployment renders
  # `repository:tag`, exactly as it did before this field existed, which
  # is what a `push: false` run or a direct caller of the chart workflow
  # packages. Anything that is not `sha256:<64 hex>` is a THIRD state and
  # is REFUSED by the template rather than rendered — see
  # templates/deployment.yaml, and kit's step, which refuses it at the
  # write.
  digest: "sha256:12e717f04dd7c6be2131b5785fd3f05cc40017fd5ca1fe7e66d21a834adf891f"
  pullPolicy: IfNotPresent

# The read-only pull secret on the box, created once, out of band:
#
#   kubectl create secret docker-registry identity-ghcr \
#     --docker-server=ghcr.io \
#     --docker-username=<deploy-bot> \
#     --docker-password=<read-only-token>
#
# The chart NAMES the secret and never contains a credential. A
# credential that reaches this file is a credential in a git
# repository, which is the one thing the pull-based loop exists to
# prevent.
imagePullSecrets: identity-ghcr

# The secret holding the service's environment, also created on the box
# and also by name only. The Deployment reads it with envFrom, so a
# value is rotated by replacing the secret and restarting the pods —
# not by editing a generated file.
#
# identity's runtime secrets, every one a NAME in this secret and never
# a value in this file. Enumerated from internal/config/config.go, the
# one place this service reads its environment:
#
#   SIGNUP_SIGNING_KEY            — REQUIRED, always. The base64url
#                                   32-byte HMAC-SHA256 key the signup
#                                   timestamp is signed under: the second
#                                   half of signup bot defence. identity
#                                   refuses to boot without it, because
#                                   the one configuration this service
#                                   must never reach is a signup form
#                                   with no defence.
#   DATABASE_URL                  — the Postgres DSN. Absent is a
#                                   supported state (no pool, and the
#                                   readiness probe is a no-op); present,
#                                   it embeds the role's password — which
#                                   is why it lives here and not in
#                                   `env` below.
#   OIDC_SIGNING_KEY             — the PEM RSA private key the OIDC
#                                   provider signs id_tokens with. One
#                                   of the OIDC block's all-or-nothing
#                                   trio (with OIDC_ISSUER and
#                                   OIDC_KEY_ID, which are not secrets).
#   MFA_ENCRYPTION_KEY            — the base64url 32-byte key every TOTP
#                                   secret is sealed under. Absent is a
#                                   supported state: a deployment with
#                                   no second factor.
#   COURIER_TOKEN                 — identity's credential for courier's
#                                   introspection endpoint. One of the
#                                   courier block's all-or-nothing pair
#                                   (with COURIER_BASE_URL, not a
#                                   secret).
#   OAUTH_ENCRYPTION_KEY          — the standard-base64 32-byte key
#                                   OAuth callback tokens are sealed
#                                   under.
#   OAUTH_GOOGLE_CLIENT_SECRET    — Google social login.
#   OAUTH_GITHUB_CLIENT_SECRET    — GitHub social login.
#   OAUTH_MICROSOFT_CLIENT_SECRET — Microsoft social login.
#   OAUTH_APPLE_PRIVATE_KEY       — the .p8 PEM Apple's client_secret
#                                   JWT is signed with.
#
# WHAT MISSING ANY OF THEM COSTS: the OIDC, MFA, courier and OAuth
# blocks are all-or-nothing and optional — a deployment without them
# boots a reduced surface and says so in the boot log. SIGNUP_SIGNING_KEY
# is the one exception, and it is a startup failure rather than a
# reduced surface: a process that could boot without it would serve an
# undefended signup form, discovered by a bot rather than by a boot log.
secretName: identity-secrets

# How many copies of the service run. One is the default for a service
# whose state is the cluster's, not the pod's; raise it when the
# service scales horizontally.
replicas: 1

# The Service in front of the container.
#
# The port MUST agree with the container port the generator baked into
# the Deployment (8080, from the Go language table — and from the
# Dockerfile's EXPOSE, which internal/chart's test asserts). A Service
# that forwards to a different port than the container listens on is a
# Service that routes to nothing.
service:
  type: ClusterIP
  port: 8080

# How the service is reached from outside the cluster: an Ingress,
# gated on `ingress.enabled`.
#
# identity's OIDC public face (discovery at
# `/.well-known/openid-configuration` and `/.well-known/jwks.json`)
# is served on its own host `auth.anywaye.com` — the issuer verifiers
# fetch and cache. The app-API surface (`/v1/*`) stays internal and
# is reached through the gateway (`api.anywaye.com`); the sign-in form
# is parlor's page. `ingress.host` is the OIDC host, `ingress.path`
# is `/` so discovery and JWKS answer at the issuer origin, with
# `pathType: Prefix` matching gateway and parlor's own Ingress.
#
# The edge is Traefik, k3s's default ingress controller, with
# cert-manager in front of it (DEPLOYMENT.md:28 — "Ingress + TLS |
# Traefik (k3s default) + cert-manager | declarative, no edge
# box"). The ClusterIssuer is created ONCE PER CLUSTER by the
# substrate's install step 7 (DEPLOYMENT.md, "The ACME solver" —
# letsencrypt-staging and letsencrypt-prod, HTTP-01 through Traefik);
# this block only NAMES it — the same "names the secret and never
# contains a credential" discipline the imagePullSecrets block uses.
ingress:
  enabled: true
  className: traefik
  host: "auth.anywaye.com"
  clusterIssuer: letsencrypt-prod
  tls: true
  path: /
  pathType: Prefix

# The service's environment, as NAME: value pairs.
#
# Only NON-SECRET values live here. Every secret is in `identity-secrets`
# above, loaded via envFrom — a secret inlined in this file is a secret
# in git, which is the one thing the pull-based loop exists to prevent.
#
# PORT is the one non-secret value worth stating: it is the port the
# Go service binds (8080 by default in code), written here so the
# Service port, the container port and this value cannot drift apart.
# LOG_LEVEL (default info) and NATS_URL (optional; absent is the
# shipped state, events accumulate in outbox_events until a broker is
# wired) are left to the secret if a deployment wants to set them.
env:
  PORT: "8080"

# What the container is allowed to ask for and keep. Requests are what
# the scheduler places the pod on the basis of; limits are what it is
# killed at. DEPLOYMENT.md sizes the box at 8GB comfortable / 4GB no
# longer qualifying, so these are starting points for a small service
# on a shared box, not a measurement — adjust them to the service's
# real footprint.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# The readiness probe's timing. The PATH is not here: it is /readyz,
# the fleet's contract, baked into the template — see the chart README
# for why a readiness path that can be edited is a defect waiting.
readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10

# The ArgoCD Application this chart is deployed by.
#
# targetRevision is the git ref Argo syncs. The manifest's default
# branch is the default, which is the pull-only loop: push a values
# commit, Argo sees it, the box agrees with git. Pin a tag here to make
# a deploy track a release instead of a branch.
#
# NOTE: this chart ships NO Application — see the chart README. The
# substrate's own static Application
# (kit/templates/substrate/manifests/applications/identity.yaml) is
# what deploys this chart, and it pins `targetRevision: 0.1.0` — the
# chart's version as the OCI tag, not a git ref. This value is
# therefore unused; it is kept so a regeneration does not fail on a
# missing key.
targetRevision: master

# The namespace the service lands in. One service per namespace, so the
# namespace is the unit Argo syncs and the unit a rollback reverts.
namespace: identity
