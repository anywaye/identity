
services:
  postgres:
    environment:
      KIT_POSTGRES_DATABASES: ${KIT_POSTGRES_DATABASES:-identity}
      KIT_POSTGRES_ROLE_CONNECTIONS: ${KIT_POSTGRES_ROLE_CONNECTIONS:-50}

  identity:
    build:
      context: .
      args:
        GO_VERSION: "1.26"
    image: anywaye/identity:dev
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      LOG_LEVEL: debug
      DATABASE_URL: postgres://identity_app:${KIT_POSTGRES_PASSWORD:-anywaye}@postgres:5432/identity?sslmode=disable

      SIGNUP_SIGNING_KEY: ${SIGNUP_SIGNING_KEY:-aWRlbnRpdHktZGV2ZWxvcG1lbnQtc2lnbnVwLWtleSE}

      NATS_URL: nats://nats:4222

      COURIER_BASE_URL: "http://courier:4000"
      COURIER_TOKEN: "${COURIER_TOKEN:?set COURIER_TOKEN to the same identity-issued API key courier holds as COURIER_IDENTITY_TOKEN}"
      PASSWORD_RESET_LINK_TEMPLATE: "${APP_BASE_URL:-http://localhost:3997}/reset-password?token={token}"
      EMAIL_VERIFICATION_LINK_TEMPLATE: "${APP_BASE_URL:-http://localhost:3997}/verify-email/confirm?token={token}"
      EMAIL_CHANGE_LINK_TEMPLATE: "${APP_BASE_URL:-http://localhost:3997}/email-change/confirm?token={token}"

      INVITATION_LINK_TEMPLATE: "${APP_BASE_URL:-http://localhost:3997}/invitations/accept?token={token}"


      IDENTITY_OTEL_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_VERSION: "0.0.0-dev"

      DEPLOYMENT_ENVIRONMENT: development

    networks:
      - platform


    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/service", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
