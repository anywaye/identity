# identity's own compose file — an OVERRIDE, not a copy.
#
#   bin/dev            # fetch the pinned kit stack, merge it with this file, up
#   docker compose -f <kit>/templates/compose/docker-compose.yml \
#                  -f ./docker-compose.yml up -d --wait
#
# THIS FILE OWNS FOUR THINGS AND NOTHING ELSE
#
#   1. `KIT_POSTGRES_DATABASES: identity`   (kit ships the cluster; the DATABASE
#      is the isolation boundary, so naming identity is the whole of it)
#   2. the `identity` service: its image, its port, its environment
#   3. the crash layer: where this container's stdout/stderr goes
#   4. nothing at all about the collector
#
# WHY THERE IS NO `postgres:` CONTAINER HERE ANY MORE, and it is the first thing
# a reader will look for. kit's stack already ships one, and a second copy is two
# postgres majors to upgrade and a port collision on the second developer on the
# machine. Pointing at kit's is an ENVIRONMENT override, which is the one kind
# compose merges correctly — see the note on `ports:` below for the kind it does
# not.
#
# THE POSTGRES MAJOR IS KIT'S TO CHOOSE, AND THIS ADOPTION CHANGES WHOSE IT IS.
# A pre-kit-22 shared volume was provisioned by `postgres:17-alpine`; kit's
# cluster is `kit-postgres:${KIT_POSTGRES_TAG:-17}`, which is Debian rather than
# alpine because pgvector cannot load on musl. Nothing in this repository pins a
# major, which is the point — it is raised in kit and picked up here.
#
# WHAT THAT COSTS A DEVELOPER WITH AN EXISTING VOLUME, reproduced deliberately
# rather than described. `docker-entrypoint-initdb.d` runs once per volume, so
# provisioning is not re-applied and a server that cannot read its own data
# directory refuses to start:
#
#   $ docker compose up postgres        # PG 17 volume, stack asking for major 16
#   FATAL:  database files are incompatible with server
#   DETAIL: The data directory was initialized by PostgreSQL version 17, which is
#           not compatible with this version 16.
#
# so after moving the pin, `bin/dev down && bin/dev up` is NOT enough — the
# volume has to be recreated once with `bin/dev nuke`. kit's own "Adopting this"
# says the same thing for the same reason; it is repeated here because this is a
# major change and the failure names a version rather than the cause. The
# alternative is leaving a developer's local `identity` rows to avoid one command,
# which is the wrong trade for a development database.
#
# WHAT THIS FILE MAY NOT DO, and the collector is the reason
#
#   It may not touch `otel-collector`. Not its image, not its command, and above
#   all not the `volumes:` entry that mounts `otel-collector.yml`. That file
#   carries the redaction allowlist, which kit DERIVES from core's schemas; a
#   service that owned it would be shipping a telemetry boundary nobody derived,
#   and prompt content would leave the process inside it. kit's
#   tests/fleet_check.py fails this repository over any of the three, and the
#   moment `kit.ref` exists below, that failure has no discretion left in it.
#
#   `<SERVICE>_OTEL_ENDPOINT` is the only contract between this service and an
#   observability backend. It is set below, to the collector that ships with the
#   stack. A self-hoster already running Datadog, Honeycomb or Grafana Cloud sets
#   that one variable in THEIR deployment and this stack goes quiet — bring-your-own
#   is a supported deployment, not a degraded mode.
#
# WHY THERE IS NO `depends_on: otel-collector`, and it is load-bearing
#
#   Nothing but the collector may be in a readiness path. A service that waits for
#   the collector serves no traffic while the collector is down, which is strictly
#   worse than serving traffic with no traces — and it teaches people to switch
#   telemetry off, which is the opposite of what this packet is for. kit's gate
#   fails on a `depends_on` naming the collector, and its
#   tests/no_telemetry_in_readiness.sh proves the underlying property against a
#   real collector by killing it and showing the service still serving.
#
#   The same rule is why the SDK's exporter is constructed but never retried: a
#   collector that is not up yet is the normal state of a fresh `docker compose
#   up`, and the service must not care.

services:
  # THE ONLY THING THIS FILE SAYS ABOUT POSTGRES, and it is one variable.
  #
  # `KIT_POSTGRES_DATABASES` is the declaration. Each comma-separated name
  # becomes BOTH a database and a NOSUPERUSER role that owns it, provisioned by
  # kit's `templates/compose/postgres/initdb/10-cluster.sh` on a fresh volume.
  # Everything else about the cluster belongs to kit.
  #
  # WHY POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD ARE NOT HERE ANY MORE.
  # They were, and this file's git history is the receipt, because kit's own
  # `tests/fleet_check.py` recommends exactly that override — "point it at its
  # own database by overriding the postgres service's environment (POSTGRES_DB /
  # POSTGRES_USER)" — which was correct when each service ran its OWN container
  # and is a boundary breach on a shared one. `POSTGRES_USER` is not a service's
  # role: it is the SUPERUSER the official image creates, the one role the whole
  # cluster's privileges are anchored to. Overriding it to `identity` therefore
  # does not give identity its own database — it makes the AUTH SERVICE's
  # credentials a cluster superuser, and a superuser reads every database in the
  # cluster regardless of what the init script revoked.
  #
  # Measured on a real cluster built from kit's own stack at the pinned ref, with
  # this file's previous three lines in place and nothing else changed:
  #
  #   $ psql -U courier -d courier -c 'create table deliveries(id int, note text)'
  #   $ psql -U courier -d courier -c "insert into deliveries values (1,'private')"
  #   $ psql -U identity -d courier -c 'select * from deliveries;'
  #    id |  note
  #   ----+---------
  #     1 | private
  #   (1 row)                                     <-- the auth service read
  #                                               another service's rows
  #
  # and `pg_roles` agreed with the reason rather than the symptom:
  #
  #   rolname  | rolsuper | rolconnlimit
  #   ---------+----------+--------------
  #    courier | f        |           10
  #    identity| t        |           -1        <-- superuser, no blast radius
  #
  # So the isolation the whole cluster contract exists to provide was defeated by
  # a three-line override that kit's gate recommends. That is worth saying here
  # rather than only in the commit message: the next reader is one `grep` away
  # from reintroducing it, and the file above used to look like the safe answer.
  #
  # THE LOG LINE THIS FILE'S REMOVAL BUYS BACK. With those three lines present
  # the cluster still came up HEALTHY and still printed kit's closing sentence:
  #
  #   [cluster] done: 1 service database(s), one role each, PUBLIC holds CONNECT
  #                    on none of them
  #
  # which was false of identity in two ways at once — identity's database was
  # created by the IMAGE rather than by the init script, so it never got a
  # NOSUPERUSER role, a per-role CONNECTION LIMIT or the two timeouts; and
  # `identity` held no declared database at all. A green healthcheck and a
  # reassuring boundary sentence, over a superuser. That is the failure shape
  # kit's own README calls out as the one that must not be papered over.
  #
  # WHY THE DEFAULT IS `${KIT_POSTGRES_DATABASES:-identity}` AND NOT A LITERAL.
  # This is a KIT variable, not identity's own port: the value an operator wants
  # is the whole fleet's list, because one cluster serves every service, and that
  # list does not fit in a service's repository. So it stays overridable from the
  # environment or `.env`, and a single-service checkout still works with no
  # configuration at all. The consequence is stated rather than hidden: whoever
  # declares the list LAST against a shared volume decides what the next `bin/dev
  # up` sees, so a genuinely shared local cluster wants one operator-owned `.env`
  # and not nine checkouts each contributing one name.
  postgres:
    environment:
      KIT_POSTGRES_DATABASES: ${KIT_POSTGRES_DATABASES:-identity}
      # THE ROLE CONNECTION LIMIT IS RAISED, AND THE REASON IS A MEASURED
      # FAILURE RATHER THAN A PREFERENCE.
      #
      # kit's default is 10, which is sized for ONE service process: identity's
      # own pool defaults to `MaxConns = 8` (internal/platform/db/db.go), so the
      # running service fits inside 10 with room for the readiness probe. It fit
      # before this packet for a different reason — identity ran its OWN
      # container, which had no per-role cap at all.
      #
      # What does not fit is `bin/prime`. `go test ./...` runs several package
      # binaries concurrently and each opens its own pool, and the cap is per
      # ROLE, so they share one budget of 10. Measured on this repository's
      # committed suite against the shared cluster at kit's default:
      #
      #   --- FAIL: TestCreateStoresWhatItWasGiven (0.34s)
      #       failed to connect to `user=identity database=identity`:
      #       [::1]:15500 (localhost): server error: FATAL: too many connections
      #       for role "identity" (SQLSTATE 53300)
      #
      # 34 failures, all with that same sentence, and none of them about the code
      # under test. Raising the limit to 50 on the same cluster and re-running
      # the identical command gave exit 0 with zero `--- FAIL` lines. So the
      # limit is the whole story and nothing else was adjusted.
      #
      # WHY 50 AND NOT "ENOUGH". It is the number of concurrent pool-holding test
      # packages with headroom, not a target. The honest cost: this variable is
      # applied by the init script to EVERY role in the cluster, so raising it for
      # identity raises the blast radius for all of them. That is the mechanism
      # kit provides — `templates/database/README.md` says a service that needs
      # more raises its share here and says why in the PR, which is what this
      # paragraph is — and it is the right trade for a development cluster.
      #
      # IT INTERACTS WITH `KIT_POSTGRES_MAX_CONNECTIONS`, which kit checks as a
      # FLOOR of (role limit x declared databases) + reserved connections. One
      # database at 50 is 53 against a default of 200 and passes. The whole fleet
      # declared at 50 would be 453 and would fail that check, so a genuinely
      # shared local cluster carrying every service needs
      # `KIT_POSTGRES_MAX_CONNECTIONS` raised alongside this. Left operator-owned
      # rather than defaulted here: a number that has to move when the fleet moves
      # belongs where the fleet is declared.
      KIT_POSTGRES_ROLE_CONNECTIONS: ${KIT_POSTGRES_ROLE_CONNECTIONS:-50}

  identity:
    build:
      context: .
      args:
        GO_VERSION: "1.26"
    image: cafaye/identity:dev
    # Published, because a developer runs `curl localhost:8080/healthz` and because
    # a test container on the host has to reach it.
    #
    # A literal, and NOT a `${KIT_*:default}` — this is a service's OWN port, not
    # one of kit's, and kit's port block is a statement about the shared
    # infrastructure. 8080 is identity's own historical port and clients'
    # documentation says so; moving it is a breaking change to a published
    # contract, not a compose edit.
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      LOG_LEVEL: debug
      # Over the compose network, by service name. The host mapping above is for
      # the developer and the host-side test suite, and is not how the service
      # reaches its own database.
      #
      # `identity_app:...` is the LOGIN ROLE, and `identity` at the end is the
      # DATABASE — two different roles of the same service, and the distinction is
      # the point of this line rather than a detail of it.
      #
      # kit's cluster provisions BOTH per service: `identity` OWNS the database
      # and every table in it and is what `bin/migrate` connects as, and
      # `identity_app` owns NOTHING and is what the RUNNING SERVICE logs in as.
      # That split is the whole account boundary: Postgres exempts a table's
      # owner from its own row-level-security policies, so a service whose pool
      # ran as the owner read every account's rows while every policy on the table
      # sat in the catalog looking like a boundary. `identity_app` cannot
      # `ALTER TABLE … DISABLE ROW LEVEL SECURITY`, cannot drop a policy, and is
      # named in all four of them — migration 00016, which installs them.
      #
      # THE OWNER IS NOT NAMED HERE ANYWHERE ELSE, and that is deliberate: the
      # service must never migrate itself at boot (config/deploy.yml says why), so
      # nothing the running process reads gives it the owner role. A DSN that did
      # would put the migration credential and the request credential in the same
      # environment, one variable away from each other.
      #
      # The password is the CLUSTER's development password rather than a
      # per-service one, and that is kit's stated arrangement rather than a
      # shortcut here: every role in a development cluster takes
      # `$POSTGRES_PASSWORD`, and isolation is by privilege and never by secret —
      # which is exactly why the boundary can be demonstrated by anyone who has
      # the file. Production roles carry distinct passwords from the deployment
      # secret store, and nothing about the boundary changes.
      #
      # The literal password `identity` this used to carry was correct only while
      # identity ran its OWN container with its own POSTGRES_PASSWORD. Against the
      # shared cluster it is simply the wrong password: the role's password is
      # the cluster's, so leaving it here is an authentication failure at boot,
      # not a security improvement.
      DATABASE_URL: postgres://identity_app:${KIT_POSTGRES_PASSWORD:-cafaye}@postgres:5432/identity?sslmode=disable

      # ---------------------------------------------------------------------
      # THE SIGNUP TIMESTAMP KEY — THE ONE SECRET A BOOT CANNOT GO WITHOUT
      #
      # SIGNUP_SIGNING_KEY is the HMAC-SHA256 key the signup timestamp is
      # signed under: the second half of signup bot defence, and the one
      # secret in this block with no supported absent state. Every other
      # secret here belongs to a feature that may be off; this one belongs to
      # no feature, and config.Load refuses to start without it. So this
      # block carries a value, and the value is a DEVELOPMENT one, labelled
      # as such.
      #
      # WHY A DEFAULT AT ALL, WHEN COURIER_TOKEN — further down — HAS NONE.
      # The difference is what a missing value costs. A missing COURIER_TOKEN
      # is a feature that is off: the recovery routes answer 503 and say why,
      # and compose's `${VAR:?}` refusal is the right shape for it. A missing
      # SIGNUP_SIGNING_KEY is not a feature being off; it is the process
      # refusing to start, which on a fresh clone with no `.env` is a developer
      # who typed `docker compose up` and met a startup error naming a variable
      # they have never heard of. The dev default is what makes the install
      # path work; the label is what keeps it honest.
      #
      # THE VALUE IS THE base64url OF `identity-development-signup-key!` — 32
      # ASCII bytes, so it decodes to exactly 32 bytes and passes the length
      # check. It is not random and not secret: it is the same on every dev
      # machine, and anyone who reads this file can mint signup timestamps for
      # a stack that carries it — which is what a development stack wants, and
      # what a production stack must never do. A deployment that wants a
      # different key sets SIGNUP_SIGNING_KEY in `.env`; the interpolation is
      # the whole of the override, and production gets its key from
      # `.kamal/secrets` (config/deploy.yml), where there is no default.
      #
      # MINT A REAL ONE WITH:
      #
      #   openssl rand -base64 32 | tr '+/' '-_' | tr -d '='
      #
      # `openssl rand -base64 32` ALONE IS THE WRONG COMMAND: it emits the
      # standard alphabet and one `=` of padding, and the validator is
      # base64url WITHOUT padding, so a key pasted from it fails boot with
      # "it is not base64url". The `tr` pair is what makes the command produce
      # exactly what config.Load accepts.
      SIGNUP_SIGNING_KEY: ${SIGNUP_SIGNING_KEY:-aWRlbnRpdHktZGV2ZWxvcG1lbnQtc2lnbnVwLWtleSE}

      # ---------------------------------------------------------------------
      # THE EVENT BUS, ON BY DEFAULT
      #
      # kit's stack runs NATS with JetStream (`-js`) on the `platform` network,
      # which this service is also on, so the broker resolves by service name.
      # With this set the outbox publisher loop starts at boot and every event
      # identity writes leaves the table on the subject equal to its type.
      #
      # THE STREAM IS THE STACK'S, AND IT DOES NOT EXIST YET. kit defines no
      # streams and no other service publishes, so a JetStream publish to a
      # subject no stream matches is refused by the broker — every event stays
      # in outbox_events with attempts climbing and last_error naming the
      # refusal. That is the designed failure direction (loud, claimable,
      # retryable), and the fix is a stream whose subject filter covers what
      # identity publishes, e.g. identity.> — a deployment decision for the
      # NATS stack, not something this service may choose for itself.
      #
      # The broker being absent or unhealthy is NOT a boot failure: the
      # publisher connects with RetryOnFailedConnect, so a stack brought up
      # before nats is ready accumulates rows and drains when it returns.
      NATS_URL: nats://nats:4222

      # ---------------------------------------------------------------------
      # THE MAIL PATH, ON BY DEFAULT
      #
      # identity sends no mail itself: every recovery message goes out as
      # `POST /v1/messages` to courier over HTTP, authenticated by the bearer
      # token below. Without this block a composed stack boots with no mail
      # path and every recovery route answers 503 with a sentence naming a
      # problem the developer was never told to configure — the mail half of
      # the sellable loop did not exist in the only bring-up this repository
      # ships.
      #
      # COURIER_BASE_URL is courier's compose-network name and its OWN port
      # (4000 — its compose `PORT`, not identity's 8080). `http` is accepted
      # for a compose stack; the service validates the scheme at boot.
      #
      # COURIER_TOKEN IS REQUIRED FROM OUTSIDE THE REPOSITORY, and the
      # interpolation's failure message is the contract rather than a
      # decoration. The rule it states: this must be the SAME identity-issued
      # API key that courier holds as COURIER_IDENTITY_TOKEN. courier
      # introspects the token identity presented on the inbound request, and
      # identity's introspection endpoint lets a token caller introspect ONLY
      # ITSELF (internal/httpapi/apikeys.go, mayIntrospect) — so the seam works
      # when one key is held by both services, and two distinct keys produce
      # identity's 403 and courier's 503 with nothing in either repository to
      # explain it. Mint one with
      # `POST /v1/accounts/{account_id}/api-keys` against an account that belongs
      # to the mail path and to nothing else.
      #
      # WHY REQUIRED AND NOT A DEFAULT. A credential cannot be defaulted
      # honestly: an empty default is treated as absent, which is the silent
      # 503 this block exists to end, and a non-empty default is a shared
      # secret committed to a repository. So `docker compose up` on a fresh
      # clone now fails naming COURIER_TOKEN before any container starts —
      # the fail-loud direction this file chooses everywhere, and the same
      # shape courier's own compose file already uses for
      # COURIER_IDENTITY_TOKEN. Keeping the two equal is the install
      # script's job (m68), which writes the value into `.env`.
      #
      # THE LINK TEMPLATES point at the launch front door, which is a
      # deployment fact identity does not own — so they are supplied from
      # outside too, with an obviously-dev default pointing at the local
      # parlor (port 3997, its documented dev port; the paths are parlor's
      # reset-password and verify-email/confirm screens, both of which read
      # `?token=`, and the email-change/confirm path that parlor will grow
      # beside them). An operator sets APP_BASE_URL in `.env` to point the
      # links at the real front door. Unlike the token these CAN have a
      # default: a wrong link is a broken button, not a security hole, and
      # the default points at the one screen that exists locally. Each
      # carries `{token}`, which config.Load requires — a template without it
      # is refused, because a link would carry no token and the reader would
      # reach a screen with nothing to redeem.
      COURIER_BASE_URL: "http://courier:4000"
      COURIER_TOKEN: "${COURIER_TOKEN:?set COURIER_TOKEN to the same identity-issued API key courier holds as COURIER_IDENTITY_TOKEN}"
      PASSWORD_RESET_LINK_TEMPLATE: "${APP_BASE_URL:-http://localhost:3997}/reset-password?token={token}"
      EMAIL_VERIFICATION_LINK_TEMPLATE: "${APP_BASE_URL:-http://localhost:3997}/verify-email/confirm?token={token}"
      EMAIL_CHANGE_LINK_TEMPLATE: "${APP_BASE_URL:-http://localhost:3997}/email-change/confirm?token={token}"

      # ---------------------------------------------------------------------
      # SOCIAL LOGIN, OFF BY DEFAULT
      #
      # Every `OAUTH_*` variable is optional and none of them is set here, which is
      # the shipped state: with no client credentials the social routes are ABSENT
      # rather than present-and-404, and a development stack cannot reach Google or
      # GitHub anyway.
      #
      # The endpoint overrides are what a local stack points at something it
      # controls — a fake IdP, or a stub — without the flow being able to reach a
      # third party. They are read once at startup, so changing them means a
      # restart, and a value that is present but undialable fails the boot naming
      # itself rather than falling back to the real provider.
      #
      #   OAUTH_REDIRECT_BASE_URL: https://identity.cafaye.com
      #   OAUTH_ENCRYPTION_KEY: <standard base64 of 32 raw bytes>
      #   OAUTH_GOOGLE_CLIENT_ID / OAUTH_GOOGLE_CLIENT_SECRET
      #   OAUTH_GITHUB_CLIENT_ID / OAUTH_GITHUB_CLIENT_SECRET
      #   OAUTH_GOOGLE_AUTHORIZE_URL / OAUTH_GOOGLE_TOKEN_URL / OAUTH_GOOGLE_USERINFO_URL
      #   OAUTH_GITHUB_AUTHORIZE_URL / OAUTH_GITHUB_TOKEN_URL
      #   OAUTH_GITHUB_USERINFO_URL / OAUTH_GITHUB_EMAILS_URL
      #
      # A provider is mounted only when BOTH halves of its credentials are set, and
      # only the variables listed for a provider it actually has: Google has no
      # emails endpoint, so setting one for it fails the boot rather than quietly
      # doing nothing.

      # ---------------------------------------------------------------------
      # OBSERVABILITY, ON BY DEFAULT
      #
      # One variable, and it is the only contract (core D16). Unset it and the
      # collector that ships with the stack is the default — that is the whole of
      # "a deployer gets traces without assembling them". Point it at any OTLP
      # endpoint and identity exports there instead.
      #
      # It is declared here, in the service's own file, rather than defaulted in
      # the Go code alone, so that a reader of this file can see where telemetry
      # goes without reading the source. The code's default is the same address:
      # two places naming one value is the cost of the code having to work when
      # nobody runs compose at all, and TestTheEndpointContractIsOneVariable holds
      # the Go side to `<SERVICE>_OTEL_ENDPOINT`.
      IDENTITY_OTEL_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_VERSION: "0.0.0-dev"

      # resource, not a measurement. `tenant_id` on a span is a series per
      # tenant, and at a thousand tenants the collector has folded the stream and
      # every per-tenant breakdown silently undercounts while the total stays
      # right. Unset by default: a single-tenant development stack has no tenant
      # to name, and an empty one would show up as a second service row in every
      # collector's service list.
      # IDENTITY_TENANT_ID: ""
      #
      # deployment.environment is an ENUM in core's resource schema
      # (development/test/staging/production), so the four values below are the
      # four that are legal and `local` is not one of them.
      DEPLOYMENT_ENVIRONMENT: development

    # ON KIT'S `platform` NETWORK, and this line is not optional tidiness.
    #
    # kit puts every service it ships on a network called `platform`. A service
    # in the SECOND compose file that declares no `networks:` lands on the
    # project's `default` network instead, and `default` and `platform` are two
    # different networks in two different DNS domains — so every hostname this
    # service uses stops resolving the moment it starts. Measured, from
    # `docker compose config` on the merged file before this line:
    #
    #     identity:   networks: {default: null}
    #     postgres:   networks: {platform: null}
    #     otel-collector: networks: {platform: null}
    #
    # and the symptom at `up`, which names neither the network nor the database:
    #
    #     failed to connect to `user=identity_app database=identity`:
    #     lookup postgres on 127.0.11: no such host
    #
    # `127.0.0.11` is Docker's embedded DNS, and it is the tell: the resolver
    # the container was given serves ITS OWN network's names, and `postgres` is
    # not on it. The pool is lazy, so this is where the defect surfaces —
    # `db.Open` parses and constructs without dialling, so `/readyz` is what
    # reports it rather than a crash at boot.
    #
    # The same missing line is why courier's `syslog` driver below made its
    # failure louder than this one does: the driver resolves `otel-collector`
    # from the DAEMON rather than from the container, so a wrong-network service
    # dies before it can serve and says so. Here it starts, and then cannot
    # reach its database.
    #
    # No other adopter is a reason not to have it — courier, darkroom and muse
    # each carry this same stanza with this same reason, and no check requires
    # it, so it is a fleet finding rather than an identity-only one.
    networks:
      - platform

    # THE CRASH LAYER, and it is the reason a panic reaches an operator with no
    # per-language log SDK in it.
    #
    # Every one of the six languages writes a fatal error to stderr; in a
    # container that is the log stream. Docker's `syslog` driver ships it over the
    # compose network to the collector's `syslog/crash` receiver, which makes a
    # panic a log record with a `service.name` on it and no per-language
    # dependency at all.
    #
    # `syslog` rather than `filelog` on `/var/lib/docker/containers`, and that is
    # a portability decision with a history: the filelog form works on a Linux host
    # and does not work at all under Docker Desktop or OrbStack, where the
    # daemon's filesystem lives inside a VM the host cannot bind-mount without
    # asking for a shared directory. The syslog driver delivers the same bytes from
    # the same place on every platform.
    #
    # NO HOST PORT, and the receiver it talks to is not published either. A syslog
    # receiver on the host loopback is an unauthenticated log-injection point for
    # anything else on the machine.
    #
    # `tag` is the process identity the collector promotes to `service.name` when a
    # record has none — see `transform/cafaye_logs` in the collector config. It
    # has to match the service name or a crash is filed against `unknown`.
    #
    # WHERE THIS STANZA WORKS, AND WHERE IT DOES NOT. The decision above is
    # unchanged and stands: `syslog` is the crash layer, on every platform, with
    # no per-language dependency. What differs by host is whether the DAEMON can
    # resolve the receiver's NAME, and that is a property of the daemon's
    # resolver rather than of the compose network:
    #
    #   - A Linux dockerd runs the driver in the host's network namespace and
    #     resolves `otel-collector` over the same bridge the containers are on.
    #     The stanza works as written.
    #   - Docker Desktop and OrbStack run the daemon inside a VM whose resolver
    #     is the HOST's (0.250.250.200:53 on OrbStack), and a compose service
    #     name exists in no host DNS zone. The container then cannot START:
    #
    #       failed to create task for container: failed to initialize logging
    #       driver: dial tcp: lookup otel-collector on 0.250.250.200:53: no such host
    #
    #     Measured with no compose file and no cafaye involved: `docker run --rm
    #     --log-driver syslog --log-opt syslog-address=tcp://otel-collector:15514
    #     alpine:3 echo hi` fails identically. The same command with the
    #     collector's CONTAINER IP instead of its name exits 0.
    #
    # SO THE ADDRESS IS A VARIABLE, and the name stays the default. On a Linux
    # daemon nothing needs setting and the documented behaviour is what runs; on
    # Docker Desktop / OrbStack a developer sets `IDENTITY_SYSLOG_ADDRESS` in
    # `.env` (git-ignored) to the collector's address on the platform network —
    #
    #   docker inspect -f '{{.NetworkSettings.Networks.identity-compose_platform.IPAddress}}' \
    #     identity-compose-otel-collector-1
    #
    # (the key is `<project>_platform`, prefixed with `${KIT_STACK_NAME:-cafaye}`,
    # which is why it is worth reading off `docker inspect` rather than being
    # guessed) — and the crash layer is fully in place,
    # because the bytes arrive at the same receiver over the same transport.
    # The variable names the ADAPTER to the host's resolver, and nothing about
    # the decision: the receiver is still the collector's `syslog/crash`, still
    # unpublished, still the same `tag`.
    #
    # AND THE ADDRESS MOVES WHEN THE NETWORK IS RECREATED, which `bin/dev nuke`
    # does. Measured across three fresh volumes here: 192.168.158.2, then .3,
    # then .4. So the loop after a nuke is: bring the stack up once, read the
    # address, write it into `.env`, run `bin/dev up` again — and the second run
    # is the one that comes up complete. Two commands where one works on a Linux
    # daemon, and
    # it is the price of the daemon resolving the name at all rather than a gap in
    # the crash layer. Recorded here because the failure without it names the
    # daemon's resolver and nothing about this variable.
    #
    # WHY NOT FALL BACK TO `json-file` ON A NON-LINUX HOST. Docker has no way to
    # ask "which host am I on" from a compose file, and a driver chosen by
    # anything else — a second `-f` override a developer forgets to pass, a CI
    # runner, the next person — is a crash layer that is silently absent on the
    # machines nobody re-tests. `syslog-address` is refused outright by
    # `json-file` and `local` ("unknown log opt 'syslog-address'"), so a driver
    # swap cannot even be spelled by editing the address. A variable the
    # developer sets once in a git-ignored file is the smallest thing that is
    # honest: the stanza names where it works, and the workaround is visible in
    # the developer's own `.env` rather than hidden in a committed default.
    #
    # A dropped crash layer locally is still the better failure to the OTHER one:
    # with the driver disabled a panic is in `docker logs identity-compose-identity-1`,
    # which a developer reads; with it misconfigured the container does not start
    # and there is no log anywhere.
    # NO LOG-DRIVER OVERRIDE.
    #
    # There used to be a `syslog` driver stanza here pointing at
    # `tcp://otel-collector:15514`, kept for a "crash layer". It is gone because
    # on Docker Desktop / OrbStack it is not a crash layer, it is a STARTUP
    # BLOCKER, and it fails the one way that is hardest to read:
    #
    #   failed to create task for container: failed to initialize logging
    #   driver: dial tcp: lookup otel-collector on 0.250.250.200:53: no such host
    #
    # The container never starts. There is no log to read, because the log
    # driver is the thing that failed. The daemon resolves the address in the
    # HOST namespace, not the container's, so the embedded DNS that answers
    # `otel-collector` correctly inside the platform network (127.0.0.11 ->
    # 192.168.147.6) is never consulted; the host's resolver is, and it cannot
    # see container names. The collector publishes no ports to the host either,
    # so there is no host-reachable address to point at instead.
    #
    # The workaround this replaces was a hand-copied container IP in `.env` —
    # the address moves every time the network is recreated, so `bin/dev nuke`
    # broke it again, and the loop was documented as needing two runs.
    #
    # NOTHING IS LOST, and the in-process exporter is the reason. This service
    # already speaks OTLP to the collector itself (`telemetry is on`,
    # OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318), and that path
    # is resolved INSIDE the container network, where the embedded DNS answers.
    # The syslog driver was a second, redundant route to the same receiver.
    # Container stdout and stderr — which is where a panic actually lands —
    # are captured by the default `json-file` driver and read with
    # `docker logs`, on every host, with no DNS involved.
    #
    # If you want forwarded crash logs back, publish the collector's syslog
    # port to the host and point this at `host.docker.internal:<port>`, which
    # the daemon CAN resolve. Do not reintroduce a container name here.

    # The database, and ONLY the database. Not the collector, for the reason at
    # the top of this file.
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # `/app/service -healthcheck`, and NOT `curl /readyz`, because the runtime
      # image is `gcr.io/distroless/static-debian12:nonroot` — no shell, no HTTP
      # client, no wget. The alternatives were a `build:` stanza adding curl to a
      # security service's image, or no healthcheck at all.
      #
      # The binary probes its OWN /readyz over the container loopback and exits 0
      # or 1. /readyz rather than /healthz because readiness is the one that
      # consults the database, and a probe that reports healthy against a
      # database that is gone is a probe that reports a service which answers 503
      # to everybody.
      #
      # The path is the image's own entrypoint path, not a bare name: WORKDIR is
      # /app and there is no PATH entry for it in a distroless image, so `service`
      # alone is "executable file not found".
      test: ["CMD", "/app/service", "-healthcheck"]
      # 5 * 15s plus a 5s start period is an 80s budget. The binary's own probe
      # times out at 2s, so `timeout` above it only covers the exec, and the
      # budget is about how long a service that is genuinely broken stays in
      # `starting` before it is reported unhealthy.
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
