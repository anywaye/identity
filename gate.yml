# gate.yml — how identity is gated, declared rather than guessed.
#
# WHY THIS FILE IS HERE. `core` owns the format
# (`schemas/gate.schema.json`), the checker (`harness/gate_check.py`) and the
# reasoning (`docs/gate.md`). Six of thirteen services shipped a `gate.yml`
# saying what their local gate is worth; identity was one of the seven that did
# not. The cost is specific and was measured for this file: `bin/prime` prints
# no test count, anywhere, in any mode — so a developer running it sees a green
# result and learns nothing about whether the gate can detect anything.
#
# THE TWO COMMANDS, BOTH MEASURED, AND THEY ARE NOT THE SAME. This is the
# first thing the packet asked for and it is the reason this file is not a
# formality.
#
#   Developer:  bin/prime  ==  mise run prime
#               go mod download && go build ./... && go test ./...
#               Measured green on this tree: 335s wall, exit 0.
#
#   CI:         ci/ci.yml, the `gate` job. It runs bin/prime
#               UNMODIFIED, and then runs a SECOND, STRICTER suite the
#               developer command does not: `go test -v -count=1 -race
#               -coverprofile=... ./...`, plus `goose up` above both, plus
#               `go vet ./...`, `gofmt -l .`, a lockfile guard,
#               `bin/coverage-floor`, and a boot test that starts the real
#               binary five times.
#
#   THE DIFFERENCE THAT MATTERED WAS ONE FLAG, AND IT IS NOW GONE. `bin/prime`
#   used to run `go test ./...` with no `-count=1`, which Go serves from its test
#   cache. Measured on this tree with the cache warm: **exit 0, 18 `ok` package
#   lines, 8 seconds wall, and 16 of the 18 packages read `(cached)` — two
#   packages actually executed.** A developer who ran the gate twice with nothing
#   changed got a second green gate that verified nothing at all. `-count=1` is
#   now in `bin/prime`, so the developer's command and CI's counted command agree
#   on the one thing that decides whether a green result is a fact. kit's Go
#   template already passed the flag and kit's validator (`tests/validate.sh`)
#   fails a Go CI step that omits it; see bin/prime for the long form.
#
#   Every proof below is matched against a package line rather than a test name,
#   and that is a property of the runner rather than a preference: see the note
#   above the proof list. A `(cached)` line satisfies a package-line proof, and
#   now that `-count=1` is in place no line in a green run is cached.
#
#   A THIRD COMMAND, DELIBERATELY NOT A GATE. `bin/prime --fast` runs the
#   non-database tier only — the complement of the declared db tier below —
#   for the inner loop, and it is NOT what CI runs and NOT what the proofs
#   above describe. It exists because the full gate is this fleet's slowest
#   at ~335s and 1732 of its 1989 tests sit in the 16 packages that open a
#   pool; a developer fixing a telemetry typo should not wait five minutes
#   to learn the database tier still passes. What keeps it honest is the
#   anti-rot check: a pool-opening package missing from the declared tier
#   fails the fast gate rather than being silently skipped. The declaration
#   and the check are below and in internal/platform/ci/fast_tier_test.go.
#
# ---------------------------------------------------------------------
# THE DATABASE TIER, DECLARED — the one machine-readable fact in this file.
#
#   `bin/prime --fast` runs the COMPLEMENT of the list below over
#   `go list ./...`, and REFUSES to run at all if a package whose test
#   binary links `internal/platform/dbtest` is missing from it. That
#   refusal is the anti-rot check, and it is the point of the flag:
#   without it, the first packet that adds a db package gets a fast
#   tier that silently excludes it — a green inner loop over tests that
#   never ran, which is the exact false green this fleet has been
#   burned by before (darkroom's 44 silently-skipped tests).
#
#   The list is DERIVED, never hand-maintained:
#
#     go list -test -f '{{.ImportPath}} {{range .Deps}}{{.}} {{end}}' ./... |
#       awk '{deps=substr($0, length($1)+2); if (deps ~ /internal\/platform\/dbtest/) print $1}'
#
#   keep the lines whose DEPS contain dbtest, normalise `P [P.test]` /
#   `P.test` / `P_test` back to `P`. Measured on this tree: 17 packages.
#   `internal/platform/dbtest` itself is NOT listed — it has no tests,
#   and a package does not import itself.
#
#   The marker is `#   db-tier: ` at the start of a line. bin/prime and
#   internal/platform/ci/fast_tier_test.go both read exactly these lines
#   and nothing else; the marker is the contract between them, and the
#   Go test fails in both directions — a pool package missing from the
#   list, and a listed package that opens no pool.
#
#   `--fast` IS NOT THE GATE. It is an inner-loop convenience: no
#   database, no provisioning, no migration, and none of the proofs
#   above are fast-tier proofs. CI and this declaration run `bin/prime`
#   unmodified; see the `ci` section below for why that distinction is
#   load-bearing.
#   db-tier: github.com/anywaye/identity/cmd/identity
#   db-tier: github.com/anywaye/identity/cmd/identity-staff
#   db-tier: github.com/anywaye/identity/internal/accounts
#   db-tier: github.com/anywaye/identity/internal/admin
#   db-tier: github.com/anywaye/identity/internal/agents
#   db-tier: github.com/anywaye/identity/internal/apikeys
#   db-tier: github.com/anywaye/identity/internal/auth
#   db-tier: github.com/anywaye/identity/internal/courier
#   db-tier: github.com/anywaye/identity/internal/deletion
#   db-tier: github.com/anywaye/identity/internal/httpapi
#   db-tier: github.com/anywaye/identity/internal/mfa
#   db-tier: github.com/anywaye/identity/internal/migrate
#   db-tier: github.com/anywaye/identity/internal/oauth
#   db-tier: github.com/anywaye/identity/internal/oidc
#   db-tier: github.com/anywaye/identity/internal/outbox
#   db-tier: github.com/anywaye/identity/internal/recovery
#   db-tier: github.com/anywaye/identity/internal/sessions
#   db-tier: github.com/anywaye/identity/internal/useraudit
#   db-tier: github.com/anywaye/identity/internal/users
#
# ---------------------------------------------------------------------
# THE GATE PROVISIONS ITS OWN TEST DATABASE, and the measurements.
#
#   When TEST_DATABASE_URL names a LOCAL host (127.0.0.1, localhost, ::1),
#   bin/prime runs bin/provision-testdb before the suite: it creates the
#   owner role, the app role and the database if they are absent, applies
#   every migration with the pinned goose (v3.28.0, installed into
#   $(go env GOPATH)/bin if absent — never @latest), and runs
#   `GRANT <owner>_app TO <owner>`, the membership the tenancy tests'
#   SET ROLE needs. It is idempotent. A DSN naming a non-local host is
#   refused, never provisioned. The owner/app-role split is preserved —
#   provisioning does not make the suite run as the owner, which would
#   silently disable every row-level-security policy in migrations/00016.
#   The admin connection is TEST_DATABASE_ADMIN_URL if set, else the DSN's
#   own user if it can create roles (CI), else the cluster's postgres
#   superuser. See bin/provision-testdb's header and migrations/README.md.
#
#   MEASURED WALL TIMES on this tree (2026-10-07):
#
#     full gate, from a dropped database (provisioning + suite, cold cache)
#         ~11 min — the provisioning itself is ~1s; the rest is the build
#     full gate, warm cache, suite only
#         70s
#     bin/prime --fast, warm cache
#         11s  — the complement above, no database
#
#   The full gate's TEST SUITE is unchanged by --fast and provisioning, so
#   the suite's wall time is the same before and after; what the packet
#   adds is the 11s inner loop and a few seconds of provisioning. The
#   coverage floor (70) is unchanged and still enforced by CI's
#   bin/coverage-floor; --fast is not the declared gate and runs no
#   coverage step. (The "`--fast` IS NOT THE GATE" paragraph above is the
#   load-bearing version of that sentence; it is not repeated here.)
version: 1
name: identity

gate:
  command: [bin/prime]
  miseTask: prime
  entrypoint: bin/prime
  timeoutSeconds: 3600
  proof:
    - id: mfa-tier-ran
      match: '^ok\s+github\.com/anywaye/identity/internal/mfa\t'
    - id: apikeys-tier-ran
      match: '^ok\s+github\.com/anywaye/identity/internal/apikeys\t'
    - id: admin-tests-passed
      match: '^ok\s+github\.com/anywaye/identity/internal/admin\t'
    - id: httpapi-matrix-ran
      match: '^ok\s+github\.com/anywaye/identity/internal/httpapi\t'
    - id: ci-guard-ran
      match: '^ok\s+github\.com/anywaye/identity/internal/platform/ci\t'
    - id: client-ran
      match: '^ok\s+github\.com/anywaye/identity/client\t'
    - id: cmd-identity-ran
      match: '^ok\s+github\.com/anywaye/identity/cmd/identity\t'
    - id: generated-excluded
      match: '^\?\s+github\.com/anywaye/identity/client/generated\t\[no test files\]$'
    - id: auth-tests-passed
      match: '^ok\s+github\.com/anywaye/identity/internal/auth\t'
    - id: config-tests-passed
      match: '^ok\s+github\.com/anywaye/identity/internal/config\t'


external:
  selfContained: false
  requirements:
    - kind: toolchain
      name: go 1.26 — mise.toml pins the minor, go.mod asks for 1.26.1, and ci.yml asserts the two agree
      satisfy:
        command: [mise, install]
        unmet: bin/prime exits 127 from `go mod download` with "go: command not found" in the message
    - kind: database
      name: PostgreSQL reachable at $TEST_DATABASE_URL — docker compose's postgres:17-alpine, default max_connections=100
      satisfy:
        command: [docker, compose, up, -d, postgres]
        unmet: >-
          bin/prime fails in three packages at once with "TEST_DATABASE_URL is
          set but not reachable", or `role "identity" does not exist` from goose
          while the container reports healthy — which means a local Postgres is
          holding 5432 and POSTGRES_PORT has to be set
    - kind: database
      name: the 15 migrations in migrations/ applied, as a deploy step ABOVE the suite — never inside it
      satisfy:
        command: [migrations/README.md]
        unmet: >-
          the suite fails with `relation "public.users" does not exist`, or with
          `permission denied for schema public` when the role does not own the
          schema
    - kind: network
      name: the Go module proxy, ONCE, on a cold checkout — the ~60 modules go.sum pins, fetched by bin/prime's own first step
      satisfy:
        command: [bin/prime]
        unmet: bin/prime exits nonzero at `go mod download`, naming a module in go.sum, with a network or dial error
  #
  # NOT REQUIRED, and named here so nobody goes looking for them:
  #
  #   * no credential, and this is the sharp one for a security-boundary
  #     repository. `MFA_ENCRYPTION_KEY` — the variable that looks most like a
  #     secret in this tree — is read by NO test. Every MFA test builds a
  #     config.Config literal or a Lookup over a map, so the suite needs no key
  #     and cannot leak one. ci.yml generates a key per run from /dev/urandom,
  #     masks it before the process sees it, and the log carries only its
  #     length; a literal in that file would be a secret in a repository and a
  #     literal in a step would be a secret in a retained, searchable log.
  #   * The credential in $TEST_DATABASE_URL is not a secret and is not declared
  #     as one: it is the TEST-ONLY user and password that docker-compose.yml
  #     and ci.yml already commit in plain text, and it is named as test-only in
  #     both. No DSN is written into this file, because a declaration is a
  #     document that ends up in every report about the run.
  #   * no service beyond the database above. The suite starts its own
  #     httptest servers on 127.0.0.1 with port 0, so nothing dials out and
  #     nothing needs a fixed port.
  #   * no filesystem path outside the repository. The Go build cache and the
  #     module cache are the machine's, not the tree's, and the tree is left
  #     byte-identical — which ci.yml asserts after every gate run.
  #
  # WHAT THIS DECLARATION CANNOT SEE, named so it is not over-read:
  #
  #   * the pass count. See the proofs above: Go prints none, so there is no
  #     floor here and the decrease-detector is ci.yml's.
  #   * the database schema. `gate.proof` is a line of output. Proving the tier
  #     ran against a MIGRATED schema is the `goose up` step's job in ci.yml,
  #     and this file cannot substitute for it.
  #   * the ENVIRONMENT a workflow hands the gate. The CI checker reads a
  #     workflow's step bodies to confirm the gate is invoked; it reads no
  #     `env:` block at all, because there is no core check that needs to. So a
  #     workflow that dropped TEST_DATABASE_URL from its environment would still
  #     pass the static phase — though it would then fail at run time, which is
  #     the better of the two failures.

ci:
  workflow: ci/pipeline.sh
  invokes: [bin/prime]
